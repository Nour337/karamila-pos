<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Karamila POS</title>
  <meta name="description" content="Karamila barbershop POS & manager dashboard">
  <meta name="theme-color" content="#0F172A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Karamila">
  <script>
    /* Home-screen install: on Android 9 and older, Chrome's "installed app" (WebAPK) crashes
       ("Karamila has stopped"). There we skip the manifest so "Add to Home screen" makes a plain
       shortcut that opens in Chrome and works. Real Android version comes from userAgentData
       because Chrome's user-agent string always says "Android 10". */
    (function () {
      function add() { var l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l); }
      function decide(ver) { var m = /^(\d+)/.exec(ver || ''); if (m && +m[1] > 0 && +m[1] < 10) return; add(); }
      try {
        var ua = navigator.userAgentData;
        if (ua && /android/i.test(ua.platform || '') && ua.getHighEntropyValues) {
          ua.getHighEntropyValues(['platformVersion']).then(function (v) { decide(v.platformVersion); }, add);
          return;
        }
        var m = /Android (\d+)/.exec(navigator.userAgent);
        decide(m ? m[1] : '');
      } catch (e) { add(); }
    })();
  </script>
  <link rel="icon" href="icons/app-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="h-full bg-slate-900 text-slate-50 antialiased select-none">
  <div id="app" class="min-h-full">
    <div class="flex h-screen items-center justify-center text-amber-500">Loading Karamila…</div>
  </div>
  <div id="modal-root"></div>
  <div id="toasts" class="pointer-events-none fixed inset-x-0 top-3 z-[60] flex flex-col items-center gap-2 px-3"></div>
  <noscript>Karamila POS needs JavaScript enabled.</noscript>
  <script src="i18n.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" integrity="sha384-8FWZA6BGMXhsfO+BLtrJK0We6gg5o1JyO8xQm6peWDEUs17ACA5ziE/NIAkl9z2k" crossorigin="anonymous" defer></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
